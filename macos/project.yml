name: SubtitleRefine
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ARCHS: arm64
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SubtitleRefine:
    type: application
    platform: macOS
    info:
      path: AppInfo.plist
      properties:
        CFBundleIconFile: AppIcon.icns
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.subtitlerefine.mac
        INFOPLIST_KEY_CFBundleDisplayName: Subtitle Refine
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
  SubtitleRefineProbe:
    type: tool
    platform: macOS
    sources:
      - path: Tools
      - path: Sources
        excludes: [SubtitleRefineApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.subtitlerefine.probe
  SubtitleRefineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources
        excludes: [SubtitleRefineApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.subtitlerefine.mac.tests
        TEST_HOST: ''
        BUNDLE_LOADER: ''
schemes:
  SubtitleRefine:
    build:
      targets:
        SubtitleRefine: all
        SubtitleRefineProbe: all
    test:
      targets: [SubtitleRefineTests]
